# [목적] application.properties 파일: 서버 포트·DB 연결·암호화 키·개발 초기화 설정입니다. ${...} 값은 환경변수 등 외부 설정으로 전달받습니다.
spring.application.name=gym-server
server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-init-sql=SET search_path TO gym,public
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.resources.cache.cachecontrol.no-store=true
gym.local=false
gym.bootstrap=false
gym.cookie-secure=true
logging.level.org.springframework.security=WARN

gym.cors.allowed-origins=${GYM_CORS_ALLOWED_ORIGINS:}

